{{- if .Values.restart.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "game-cronjob-game-restart.fullname" . }}
spec:
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  schedule: '{{ .Values.restart.schedule }}'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: {{ .Values.restart.serviceAccount }}
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl
              command:
                - bash
                - -c
                - >-
                  kubectl rollout restart deployments game-gamecommand &&
                  kubectl rollout status deployments game-gamecommand &&
                  kubectl rollout restart deployments game-gamecurrency &&
                  kubectl rollout status deployments game-gamecurrency
{{- end }}
